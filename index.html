
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotom Pokedex</title>
    <style>
      /* Static copy of the page used by search engines: visually hidden until React replaces it */
      #root > main[data-prerender] { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
      html.dark, html.dark body { background: #121212; }
      /* Loading indicator shown until the app mounts (React replaces everything inside #root) */
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .boot-ball { position: relative; width: 56px; height: 56px; box-sizing: border-box; border: 3px solid #1e1f24; border-radius: 50%;
        background: linear-gradient(#ef4444 0 45%, #1e1f24 45% 55%, #fff 55%); animation: boot-spin 1s linear infinite; }
      .boot-ball::after { content: ''; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; box-sizing: border-box;
        border: 3px solid #1e1f24; border-radius: 50%; background: #fff; }
      html.dark .boot-ball { border-color: #e5e7eb; background: linear-gradient(#ef4444 0 45%, #e5e7eb 45% 55%, #1e1f24 55%); }
      html.dark .boot-ball::after { border-color: #e5e7eb; background: #1e1f24; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-ball { animation-duration: 3s; } }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash / blank dark screen
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google AdSense Script -->
    <!-- Substitua o atributo src ou adicione seu client ID aqui quando for para produção -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0079702856690089" crossorigin="anonymous"></script>

</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-dark-text transition-colors duration-300">
    <div id="root"><!--boot:start--><div class="boot" role="status" aria-label="Carregando"><div class="boot-ball"></div></div><!--boot:end--></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
